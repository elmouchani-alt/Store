name: Build iOS app

# Handmatig starten: tab Actions -> "Build iOS app" -> Run workflow.
# Resultaat: een niet-ondertekende MAISON.ipa onder "Artifacts" onderaan de run.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Copy website files
        run: |
          if [ -f site/index.html ]; then SRC=site; else SRC=.; fi
          mkdir -p build/www
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude 'build' \
            --exclude 'ios-config' --exclude 'node_modules' \
            "$SRC"/ build/www/
          ls build/www | head -30

          # TIJDELIJK: controle-venster dat laat zien wat er in de app misgaat
          cat > build/www/diag.js <<'DIAGEOF'
          (function () {
            var errs = [];
            function add(m) { errs.push(String(m).slice(0, 160)); }
            window.addEventListener('error', function (e) { add('error: ' + e.message); });
            window.addEventListener('unhandledrejection', function (e) { add('promise: ' + (e.reason && (e.reason.code || e.reason.message) || e.reason)); });
            var ce = console.error; console.error = function () { add('console: ' + Array.prototype.join.call(arguments, ' ')); ce.apply(console, arguments); };
            setTimeout(function () {
              try {
                var c = window.Capacitor || {}, p = c.Plugins || {};
                var t = 'native=' + (c.isNativePlatform && c.isNativePlatform()) +
                  '\nfirebase=' + (typeof firebase) +
                  '\napps=' + (typeof firebase !== 'undefined' && firebase.apps ? firebase.apps.length : '-') +
                  '\nfirebaseAuthPlugin=' + !!p.FirebaseAuthentication +
                  '\nplugins=' + Object.keys(p).join(',') +
                  '\ngoogleButton=' + !!document.querySelector('[data-a=google]') +
                  '\nerrors=' + (errs.length ? '\n- ' + errs.slice(0, 4).join('\n- ') : 'none') +
                  '\n(tik om te sluiten)';
                var d = document.createElement('pre');
                d.style.cssText = 'position:fixed;z-index:99999;left:8px;bottom:8px;background:#000;color:#0f0;padding:10px;font:12px monospace;max-width:92vw;white-space:pre-wrap;border-radius:8px';
                d.textContent = t; d.onclick = function () { d.remove(); };
                document.body.appendChild(d);
              } catch (e) { alert(e); }
            }, 7000);
          })();
          DIAGEOF
          python3 - <<'PY'
          p = 'build/www/index.html'
          h = open(p, encoding='utf-8').read()
          h = h.replace('<head>', '<head>\n<script src="diag.js"></script>', 1)
          open(p, 'w', encoding='utf-8').write(h)
          PY

      - name: Create Capacitor project
        working-directory: build
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7 @capacitor-firebase/authentication@7 firebase
          printf '%s' '{"appId":"nl.maison.shop","appName":"MAISON","webDir":"www","ios":{"contentInset":"never","backgroundColor":"#1c1917"}}' > capacitor.config.json
          npx cap add ios

      - name: Add Google sign-in (native)
        working-directory: build
        run: |
          cat > ios/App/App/GoogleService-Info.plist <<'PLISTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>CLIENT_ID</key>
          	<string>846711763840-5ssuddnb69g628rh3gid66ir2todr05i.apps.googleusercontent.com</string>
          	<key>REVERSED_CLIENT_ID</key>
          	<string>com.googleusercontent.apps.846711763840-5ssuddnb69g628rh3gid66ir2todr05i</string>
          	<key>API_KEY</key>
          	<string>AIzaSyD-cxMGMlIRccwK0gdr5GzVs0CH2LyJ2Fs</string>
          	<key>GCM_SENDER_ID</key>
          	<string>846711763840</string>
          	<key>PLIST_VERSION</key>
          	<string>1</string>
          	<key>BUNDLE_ID</key>
          	<string>nl.maison.shop</string>
          	<key>PROJECT_ID</key>
          	<string>shop-2eab0</string>
          	<key>STORAGE_BUCKET</key>
          	<string>shop-2eab0.firebasestorage.app</string>
          	<key>IS_ADS_ENABLED</key>
          	<false></false>
          	<key>IS_ANALYTICS_ENABLED</key>
          	<false></false>
          	<key>IS_APPINVITE_ENABLED</key>
          	<true></true>
          	<key>IS_GCM_ENABLED</key>
          	<true></true>
          	<key>IS_SIGNIN_ENABLED</key>
          	<true></true>
          	<key>GOOGLE_APP_ID</key>
          	<string>1:846711763840:ios:c0f8787eb5d079637d4765</string>
          	<key>DATABASE_URL</key>
          	<string>https://shop-2eab0-default-rtdb.firebaseio.com</string>
          </dict>
          </plist>
          PLISTEOF

          # 1. Podfile: iOS 15 + Google pod
          python3 - <<'PY'
          import re
          p = 'ios/App/Podfile'
          s = open(p).read()
          s = re.sub(r"platform :ios, '[0-9.]+'", "platform :ios, '15.0'", s)
          s = s.replace("capacitor_pods\n", "capacitor_pods\n  pod 'CapacitorFirebaseAuthentication/Google', :path => '../../node_modules/@capacitor-firebase/authentication'\n", 1)
          open(p, 'w').write(s)
          PY

          # 2. URL scheme voor het terugkeren uit het Google-venster
          PB=/usr/libexec/PlistBuddy
          GS=ios/App/App/GoogleService-Info.plist
          REV=$($PB -c "Print :REVERSED_CLIENT_ID" $GS)
          $PB -c "Print :GOOGLE_APP_ID" $GS
          P=ios/App/App/Info.plist
          $PB -c "Add :CFBundleURLTypes array" $P
          $PB -c "Add :CFBundleURLTypes:0 dict" $P
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" $P
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $REV" $P

          # 3. plist aan het Xcode-project toevoegen
          cd ios/App
          ruby -e "
            require 'xcodeproj'
            proj = Xcodeproj::Project.open('App.xcodeproj')
            target = proj.targets.first
            ref = proj.main_group['App'].new_file('GoogleService-Info.plist')
            target.add_resources([ref])
            proj.save
          "
          cd ../..

          # 4. app-icoon uit de website
          if [ -f www/icon-512.png ]; then
            sips -z 1024 1024 www/icon-512.png --out ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png || true
          fi

          npx cap sync ios

      - name: Build unsigned IPA
        working-directory: build
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            build
          mkdir -p Payload
          cp -R ios/DerivedData/Build/Products/Release-iphoneos/App.app Payload/
          # controle: zit de plist in de app?
          test -f Payload/App.app/GoogleService-Info.plist || { echo "plist ZIT NIET in de app"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :GOOGLE_APP_ID" Payload/App.app/GoogleService-Info.plist
          zip -q -r MAISON.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: MAISON-ipa
          path: build/MAISON.ipa
