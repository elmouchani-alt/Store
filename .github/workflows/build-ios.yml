name: Build iOS app

# Handmatig starten: tab Actions -> "Build iOS app" -> Run workflow.
# Resultaat: een niet-ondertekende MAISON.ipa onder "Artifacts" onderaan de run.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check GoogleService-Info.plist
        run: |
          if [ ! -f ios-config/GoogleService-Info.plist ]; then
            echo "ios-config/GoogleService-Info.plist ontbreekt in de repo"; exit 1
          fi

      - name: Copy website files
        run: |
          if [ -f site/index.html ]; then SRC=site; else SRC=.; fi
          mkdir -p build/www
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude 'build' \
            --exclude 'ios-config' --exclude 'node_modules' \
            "$SRC"/ build/www/
          ls build/www | head -30

      - name: Create Capacitor project
        working-directory: build
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7 @capacitor-firebase/authentication@7 firebase
          printf '%s' '{"appId":"nl.maison.shop","appName":"MAISON","webDir":"www","ios":{"contentInset":"never","backgroundColor":"#1c1917"}}' > capacitor.config.json
          npx cap add ios

      - name: Add Google sign-in (native)
        working-directory: build
        run: |
          cp ../ios-config/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist

          # 1. Podfile: iOS 15 + Google pod
          python3 - <<'PY'
          import re
          p = 'ios/App/Podfile'
          s = open(p).read()
          s = re.sub(r"platform :ios, '[0-9.]+'", "platform :ios, '15.0'", s)
          s = s.replace("capacitor_pods\n", "capacitor_pods\n  pod 'CapacitorFirebaseAuthentication/Google', :path => '../../node_modules/@capacitor-firebase/authentication'\n", 1)
          open(p, 'w').write(s)
          PY

          # 2. URL scheme voor het terugkeren uit het Google-venster
          PB=/usr/libexec/PlistBuddy
          GS=ios/App/App/GoogleService-Info.plist
          # Als je plist (nog) geen Google-gegevens bevat, vul ze hier aan
          $PB -c "Print :CLIENT_ID" $GS >/dev/null 2>&1 || $PB -c "Add :CLIENT_ID string 846711763840-5ssuddnb69g628rh3gid66ir2todr05i.apps.googleusercontent.com" $GS
          $PB -c "Print :REVERSED_CLIENT_ID" $GS >/dev/null 2>&1 || $PB -c "Add :REVERSED_CLIENT_ID string com.googleusercontent.apps.846711763840-5ssuddnb69g628rh3gid66ir2todr05i" $GS
          REV=$($PB -c "Print :REVERSED_CLIENT_ID" $GS)
          P=ios/App/App/Info.plist
          $PB -c "Add :CFBundleURLTypes array" $P
          $PB -c "Add :CFBundleURLTypes:0 dict" $P
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" $P
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $REV" $P

          # 3. plist aan het Xcode-project toevoegen
          cd ios/App
          ruby -e "
            require 'xcodeproj'
            proj = Xcodeproj::Project.open('App.xcodeproj')
            target = proj.targets.first
            ref = proj.main_group['App'].new_file('GoogleService-Info.plist')
            target.add_resources([ref])
            proj.save
          "
          cd ../..

          # 4. app-icoon uit de website
          if [ -f www/icon-512.png ]; then
            sips -z 1024 1024 www/icon-512.png --out ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png || true
          fi

          npx cap sync ios

      - name: Build unsigned IPA
        working-directory: build
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            build
          mkdir -p Payload
          cp -R ios/DerivedData/Build/Products/Release-iphoneos/App.app Payload/
          zip -q -r MAISON.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: MAISON-ipa
          path: build/MAISON.ipa
