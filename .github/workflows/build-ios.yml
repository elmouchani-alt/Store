name: Build MAISON iOS (unsigned IPA)

# Zet dit bestand op: .github/workflows/build-ios.yml
# Start het via: Actions -> "Build MAISON iOS" -> Run workflow.
# De .ipa staat daarna onderaan de run bij "Artifacts" (MAISON-ipa).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/build-ios.yml'

env:
  APP_ID: nl.maison.shop
  APP_NAME: MAISON
  SITE_FILE: index.html          # de website in de repo (single-file versie)
  WITH_DIAG: 'true'              # zet op 'false' om het zwarte controlevenster te verwijderen
  IOS_TARGET: '15.0'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ------------------------------------------------------------------
      # 1. Capacitor-project aanmaken
      # ------------------------------------------------------------------
      - name: Install Capacitor 7 + Firebase Authentication plugin
        run: |
          mkdir -p app && cd app
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7 @capacitor-firebase/authentication@7 firebase

      - name: capacitor.config.json
        working-directory: app
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "nl.maison.shop",
            "appName": "MAISON",
            "webDir": "www",
            "ios": {
              "contentInset": "never",
              "backgroundColor": "#1c1917"
            },
            "plugins": {
              "FirebaseAuthentication": {
                "skipNativeAuth": true,
                "providers": ["google.com"]
              }
            }
          }
          EOF

      # ------------------------------------------------------------------
      # 2. De website voorbereiden (www/)
      # ------------------------------------------------------------------
      - name: Copy website into www/
        run: |
          mkdir -p app/www
          cp "$SITE_FILE" app/www/index.html

      - name: Patch website for the app (Google sign-in via native plugin)
        run: |
          python3 - <<'PY'
          import re, os
          f = 'app/www/index.html'
          s = open(f, encoding='utf8').read()
          done_on = done_act = False

          if 'FirebaseAuthentication.signInWithGoogle' in s:
              print('Al gepatcht in de bron, overslaan.')
              done_on = done_act = True
          else:
              # 1. Google-knop zichtbaar in de app als het plugin bestaat.
              #    Jouw bron heeft: const GOOGLE_ON = ... && !NATIVE;  (constante, wordt vervangen
              #    door een functie googleOn() die pas bij gebruik kijkt of het plugin er is)
              new_on = ("const googleOn = () => window.MAISON_GOOGLE_SIGNIN !== false && (!NATIVE || "
                        "!!(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.FirebaseAuthentication));")
              m = re.search(r"const GOOGLE_ON = [^;\n]*;", s)
              if m:
                  s = s.replace(m.group(0), new_on, 1)
                  s = re.sub(r"\bGOOGLE_ON\b", "googleOn()", s)
                  done_on = True
              else:
                  for pat in (r"const googleOn = \(\) => [^;\n]*;",
                              r"(?:const|let|var) googleOn\s*=\s*[^;\n]*;",
                              r"function googleOn\s*\(\)\s*\{[^}]*\}"):
                      s, n = re.subn(pat, new_on, s, count=1)
                      if n:
                          done_on = True
                          break
              print('googleOn aangepast:', done_on)

              # 2. In de app: native Google-login (klein Safari-venster), op de website: popup
              native = """if (NATIVE) {
              try {
                const r = await window.Capacitor.Plugins.FirebaseAuthentication.signInWithGoogle({ skipNativeAuth: true, scopes: ['profile', 'email'] });
                const idToken = (r && r.credential && (r.credential.idToken || r.credential.id_token)) || '';
                const accessToken = (r && r.credential && r.credential.accessToken) || '';
                if (!idToken && !accessToken) return toast('Google did not return a token.', 'error');
                await auth.signInWithCredential(firebase.auth.GoogleAuthProvider.credential(idToken || null, accessToken || null));
                afterAuth();
              } catch (e) {
                if (/cancel|12501|dismiss/i.test(String((e && e.code) || '') + ' ' + String((e && e.message) || ''))) return;
                toast((e && e.message) || authMessage(e), 'error');
              }
              return;
            }
            """
              marker = "try { await auth.signInWithPopup(googleProvider); }"
              if s.count(marker) == 1:
                  s = s.replace(marker, native + marker)
                  done_act = True
              print('Google-actie aangepast:', done_act)
              open(f, 'w', encoding='utf8').write(s)

          ok = done_on and done_act
          with open(os.environ['GITHUB_ENV'], 'a') as g:
              g.write('SOURCE_PATCHED=' + ('1' if ok else '0') + '\n')
          if not ok:
              print('::warning::De Google-regels staan anders in index.html. Het vangnet (native-google) wordt gebruikt.')
          PY

      - name: Show what the website source looks like (for debugging)
        run: |
          echo "--- externe scripts in index.html ---"
          grep -o '<script[^>]*src=[^>]*>' app/www/index.html || echo "(geen)"
          echo "--- Google-regels ---"
          grep -n -o -i '.\{0,70\}googleOn.\{0,90\}' app/www/index.html | head -12 || true
          grep -n -o -i '.\{0,50\}signInWith\(Popup\|Redirect\|Google\).\{0,60\}' app/www/index.html | head -12 || true
          grep -n -o -i '.\{0,60\}data-a=.google.\{0,60\}' app/www/index.html | head -6 || true

      # Vangnet: werkt ook als de Google-code in de bron anders is opgebouwd.
      # Alleen in de app, en alleen als het patchen hierboven niet gelukt is.
      - name: Fallback - native Google button handler
        if: env.SOURCE_PATCHED != '1'
        run: |
          cat > app/native-google.js <<'EOF'
          (function () {
            var C = window.Capacitor;
            if (!(C && C.isNativePlatform && C.isNativePlatform())) return;
            function show() {
              document.querySelectorAll('[data-a=google]').forEach(function (e) {
                e.hidden = false; e.removeAttribute('hidden'); e.style.display = '';
                var p = e.closest('[hidden]'); if (p) { p.hidden = false; p.removeAttribute('hidden'); }
              });
            }
            new MutationObserver(show).observe(document.documentElement, { childList: true, subtree: true });
            show();
            document.addEventListener('click', function (ev) {
              var el = ev.target.closest && ev.target.closest('[data-a=google]');
              if (!el) return;
              ev.preventDefault(); ev.stopImmediatePropagation();
              var P = C.Plugins && C.Plugins.FirebaseAuthentication;
              if (!P || typeof firebase === 'undefined') { alert('Google sign-in is not available yet. Please try again in a moment.'); return; }
              P.signInWithGoogle({ skipNativeAuth: true, scopes: ['profile', 'email'] }).then(function (r) {
                var c = (r && r.credential) || {};
                if (!c.idToken && !c.accessToken) throw new Error('Google did not return a token.');
                return firebase.auth().signInWithCredential(firebase.auth.GoogleAuthProvider.credential(c.idToken || null, c.accessToken || null));
              }).then(function () { location.hash = '#/account'; }).catch(function (e) {
                var m = String((e && e.code) || '') + ' ' + String((e && e.message) || '');
                if (/cancel|12501|dismiss/i.test(m)) return;
                alert((e && e.message) || 'Google sign-in failed');
              });
            }, true);
          })();
          EOF
          python3 - <<'PY'
          f = 'app/www/index.html'
          s = open(f, encoding='utf8').read()
          code = open('app/native-google.js', encoding='utf8').read()
          assert '</body>' in s, 'geen </body> gevonden'
          s = s.replace('</body>', '<script>' + code + '</script>\n</body>', 1)
          open(f, 'w', encoding='utf8').write(s)
          print('Vangnet toegevoegd.')
          PY

      - name: Add diagnostic window (diag.js)
        if: env.WITH_DIAG == 'true'
        run: |
          cat > app/www/diag.js <<'EOF'
          (function () {
            var errs = [];
            function add(m) { errs.push(String(m).slice(0, 160)); }
            window.addEventListener('error', function (e) { add('error: ' + e.message); });
            window.addEventListener('unhandledrejection', function (e) { add('promise: ' + (e.reason && (e.reason.code || e.reason.message) || e.reason)); });
            document.addEventListener('securitypolicyviolation', function (e) { add('CSP blocked: ' + e.violatedDirective); });
            var ce = console.error; console.error = function () { add('console: ' + Array.prototype.join.call(arguments, ' ')); ce.apply(console, arguments); };
            setTimeout(function () {
              try {
                var c = window.Capacitor || {}, p = c.Plugins || {};
                var t = 'native=' + (c.isNativePlatform && c.isNativePlatform()) +
                  '\nfirebase=' + (typeof firebase) +
                  '\napps=' + (typeof firebase !== 'undefined' && firebase.apps ? firebase.apps.length : '-') +
                  '\nfirebaseAuthPlugin=' + !!p.FirebaseAuthentication +
                  '\nplugins=' + Object.keys(p).join(',') +
                  '\ngoogleButton=' + !!document.querySelector('[data-a=google]') +
                  '\nerrors=' + (errs.length ? '\n- ' + errs.slice(0, 4).join('\n- ') : 'none') +
                  '\n(tik om te sluiten)';
                var d = document.createElement('pre');
                d.style.cssText = 'position:fixed;z-index:99999;left:8px;bottom:8px;background:#000;color:#0f0;padding:10px;font:12px monospace;max-width:92vw;white-space:pre-wrap;border-radius:8px';
                d.textContent = t; d.onclick = function () { d.remove(); };
                document.body.appendChild(d);
              } catch (e) { alert(e); }
            }, 7000);
          })();
          EOF
          python3 - <<'PY'
          f = 'app/www/index.html'
          s = open(f, encoding='utf8').read()
          if 'src="diag.js"' not in s:
              s = s.replace('<head>', '<head>\n<script src="diag.js"></script>', 1)
              open(f, 'w', encoding='utf8').write(s)
          PY

      # DIT IS DE FIX voor "geen enkele knop werkt":
      # de CSP laat inline scripts alleen toe met een vaste hash. Na de aanpassingen
      # hierboven klopt die hash niet meer, dus wordt het hoofdscript geblokkeerd.
      # Deze stap berekent de hashes opnieuw. Laat hem ALTIJD als laatste
      # aanpassing aan index.html staan.
      - name: Fix CSP hashes
        run: |
          python3 - <<'PY'
          import re, hashlib, base64
          f = 'app/www/index.html'
          s = open(f, encoding='utf8').read()
          h = lambda b: "'sha256-" + base64.b64encode(hashlib.sha256(b.encode('utf8')).digest()).decode() + "'"
          blocks = [b for a, b in re.findall(r'<script(?![^>]*\bsrc=)([^>]*)>(.*?)</script>', s, re.S)]
          m = re.search(r"(script-src 'self')((?: 'sha256-[^']+')*)", s)
          assert m, 'CSP script-src niet gevonden'
          s = s.replace(m.group(0), m.group(1) + ''.join(' ' + h(b) for b in blocks), 1)
          open(f, 'w', encoding='utf8').write(s)
          print('CSP bijgewerkt voor', len(blocks), 'inline scripts')
          PY

      # ------------------------------------------------------------------
      # 3. iOS-project aanmaken en instellen
      # ------------------------------------------------------------------
      - name: Add iOS platform
        working-directory: app
        run: npx cap add ios

      - name: GoogleService-Info.plist
        working-directory: app
        run: |
          cat > ios/App/App/GoogleService-Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key>
            <string>AIzaSyD-cxMGMlIRccwK0gdr5GzVs0CH2LyJ2Fs</string>
            <key>BUNDLE_ID</key>
            <string>nl.maison.shop</string>
            <key>CLIENT_ID</key>
            <string>846711763840-5ssuddnb69g628rh3gid66ir2todr05i.apps.googleusercontent.com</string>
            <key>DATABASE_URL</key>
            <string>https://shop-2eab0-default-rtdb.firebaseio.com</string>
            <key>GCM_SENDER_ID</key>
            <string>846711763840</string>
            <key>GOOGLE_APP_ID</key>
            <string>1:846711763840:ios:c0f8787eb5d079637d4765</string>
            <key>IS_ADS_ENABLED</key>
            <false/>
            <key>IS_ANALYTICS_ENABLED</key>
            <false/>
            <key>IS_APPINVITE_ENABLED</key>
            <true/>
            <key>IS_GCM_ENABLED</key>
            <true/>
            <key>IS_SIGNIN_ENABLED</key>
            <true/>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>PROJECT_ID</key>
            <string>shop-2eab0</string>
            <key>REVERSED_CLIENT_ID</key>
            <string>com.googleusercontent.apps.846711763840-5ssuddnb69g628rh3gid66ir2todr05i</string>
            <key>STORAGE_BUCKET</key>
            <string>shop-2eab0.firebasestorage.app</string>
          </dict>
          </plist>
          EOF
          plutil -lint ios/App/App/GoogleService-Info.plist

      - name: Add plist to the Xcode target
        working-directory: app/ios/App
        run: |
          ruby -e '
          require "xcodeproj"
          proj = Xcodeproj::Project.open("App.xcodeproj")
          target = proj.targets.find { |t| t.name == "App" }
          group = proj.main_group.find_subpath("App", true)
          unless group.files.any? { |f| f.path == "GoogleService-Info.plist" }
            ref = group.new_file("GoogleService-Info.plist")
            target.resources_build_phase.add_file_reference(ref)
          end
          proj.build_configurations.each { |c| c.build_settings["IPHONEOS_DEPLOYMENT_TARGET"] = ENV["IOS_TARGET"] }
          target.build_configurations.each { |c| c.build_settings["IPHONEOS_DEPLOYMENT_TARGET"] = ENV["IOS_TARGET"] }
          proj.save
          '

      - name: Info.plist (Google URL scheme)
        working-directory: app/ios/App/App
        run: |
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string com.googleusercontent.apps.846711763840-5ssuddnb69g628rh3gid66ir2todr05i" Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" Info.plist

      # Het Google-onderdeel van het plugin (GoogleSignIn). Zonder deze regel
      # zit er geen Google-login in de app. Als "pod install" hierop faalt,
      # verwijder dan alleen de regel met 'CapacitorFirebaseAuthentication/Google'.
      - name: Podfile (Google sign-in pod, iOS target)
        working-directory: app/ios/App
        run: |
          sed -i '' "s/^platform :ios, .*/platform :ios, '${IOS_TARGET}'/" Podfile
          if ! grep -q "CapacitorFirebaseAuthentication/Google" Podfile; then
            sed -i '' "/capacitor_pods/a\\
            pod 'CapacitorFirebaseAuthentication/Google', :path => '../../node_modules/@capacitor-firebase/authentication'
          " Podfile
          fi
          cat Podfile
          # "cap add ios" heeft al een Podfile.lock gemaakt (zonder Google). Die
          # botst met GoogleSignIn (GTMSessionFetcher < 4.0), dus opnieuw beginnen.
          rm -rf Podfile.lock Pods

      - name: Sync web assets + pods
        working-directory: app
        run: npx cap sync ios

      # ------------------------------------------------------------------
      # 4. Bouwen zonder handtekening, daarna .ipa maken
      # ------------------------------------------------------------------
      - name: Build (unsigned)
        working-directory: app/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET="${IOS_TARGET}" \
            build

      - name: Package .ipa
        run: |
          APP=$(find app/ios/App/build/Build/Products -name "App.app" -type d | head -1)
          echo "App gevonden: $APP"
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/App.app
          (cd ipa && zip -qry ../MAISON.ipa Payload)
          ls -lh MAISON.ipa

      - name: Check the result (CSP + plist)
        run: |
          unzip -q -o MAISON.ipa -d check
          test -f check/Payload/App.app/GoogleService-Info.plist && echo "plist: OK"
          python3 - <<'PY'
          import re, hashlib, base64
          s = open('check/Payload/App.app/public/index.html', encoding='utf8').read()
          csp = re.search(r"script-src[^;]*", s).group(0)
          hs = set(re.findall(r"'sha256-([^']+)'", csp))
          bad = 0
          for a, b in re.findall(r'<script(?![^>]*\bsrc=)([^>]*)>(.*?)</script>', s, re.S):
              if 'ld+json' in a: continue
              h = base64.b64encode(hashlib.sha256(b.encode('utf8')).digest()).decode()
              if h not in hs: bad += 1
          print('Inline scripts zonder passende CSP-hash:', bad)
          assert bad == 0, 'CSP klopt niet, knoppen zouden niet werken'
          PY
          ls check/Payload/App.app/Frameworks | grep -i -E "GoogleSignIn|AppAuth" || echo "LET OP: GoogleSignIn niet gevonden in de app"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MAISON-ipa
          path: MAISON.ipa
          if-no-files-found: error
