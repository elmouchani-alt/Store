 if(!/^(31|0)[1-9]\d{8}$/.test(ph.replace(/\D/g,'')))return msg('coM','Vul een Nederlands telefoonnummer in','error');if(!/^\d{4}\s?[A-Z]{2}$/i.test(zp))return msg('coM','Postcode graag als 1234 AB','error');
 const{L,sub,disc,ship,total}=calc();if(!L.length)return msg('coM','Je winkelwagen is leeg','error');if(L.some(l=>l.qty>(l.p.stock||0)))return msg('coM','Van een product is niet genoeg meer op voorraad','error');
 try{localStorage.setItem('mad',JSON.stringify({coP:ph,coS:st,coZ:zp,coC:ct}))}catch(x){}
 const items=L.map(l=>({id:l.id,title:l.p.title,qty:l.qty,price:l.price})),base={userId:S.user.uid,userEmail:e,userName:n,phone:ph,address:`${st}, ${zp.toUpperCase()} ${ct}`,items,subtotal:sub,shipping:ship,discount:disc,total,couponUsed:S.coupon?.id||null,status:'completed'};
 const done=async extra=>{await db.collection('orders').add({...base,...extra,createdAt:FV.serverTimestamp()});
  try{if(S.coupon)await db.collection('coupons').doc(S.coupon.id).update({uses:FV.increment(1)});for(const i of items)await db.collection('products').doc(i.id).update({stock:FV.increment(-i.qty)})}catch(x){console.warn(x.message)}
  try{if(S.user){const b=db.batch();S.cart.forEach(c=>b.delete(uref().collection('cart').doc(c.id)));await b.commit()}}catch(x){console.warn(x)}
  S.coupon=null;toast('Bedankt voor je bestelling!','success');go('orders')};
 if(total<=0){$('#coB').disabled=true;try{await done({paymentMethod:'gratis'})}catch(x){$('#coB').disabled=false;msg('coM','Bestellen lukte niet: '+fe(x),'error')}return}
 msg('coM','PayPal wordt geladen...');$('#coB').disabled=true;try{await loadPP()}catch(x){$('#coB').disabled=false;return msg('coM','PayPal kon niet laden. Controleer je verbinding of adblocker.','error')}
 msg('coM','');$('#coB').style.display='none';
 paypal.Buttons({createOrder:(d,a)=>a.order.create({purchase_units:[{amount:{currency_code:'EUR',value:total.toFixed(2),breakdown:{item_total:{currency_code:'EUR',value:sub.toFixed(2)},shipping:{currency_code:'EUR',value:ship.toFixed(2)},discount:{currency_code:'EUR',value:disc.toFixed(2)}}},items:items.map(i=>({name:i.title.slice(0,127),quantity:String(i.qty),unit_amount:{currency_code:'EUR',value:i.price.toFixed(2)}}))}]}),
  onApprove:async(d,a)=>{let det;try{det=await a.order.capture()}catch(x){return msg('coM','De betaling is niet gelukt','error')}
   try{await done({paymentMethod:'paypal',paypalOrderId:det.id})}catch(x){msg('coM',`Je betaling is binnen (PayPal-ID ${det.id}), maar opslaan mislukte. Mail ons met dit ID.`,'error')}},
  onCancel:()=>{toast('Betaling geannuleerd');$('#coB').style.display='';$('#coB').disabled=false;$('#pp').innerHTML=''},onError:()=>{toast('Betalen lukte niet. Probeer het opnieuw.','error');$('#coB').style.display='';$('#coB').disabled=false}}).render('#pp')}

// ---------- Beheer ----------
const compress=(f,max=700)=>new Promise((res,rej)=>{if(!/^image\/(png|jpe?g|webp|gif)$/.test(f.type))return rej(new Error('Kies een afbeelding (jpg, png, webp)'));const r=new FileReader();r.onerror=rej;r.onload=e=>{const i=new Image();i.onerror=()=>rej(new Error('Ongeldige afbeelding'));i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};i.src=e.target.result};r.readAsDataURL(f)});
function admin_(){return `<div class="wrap"><h1 style="margin-bottom:1.3rem">Beheer</h1><div class="kpis" id="kpis"></div><div class="tabs">${[['products','Producten'],['orders','Bestellingen'],['reviews','Reviews'],['coupons','Coupons'],['messages','Berichten'],['set','Banner'],['users','Gebruikers']].map(([k,l])=>`<button class="tab ${S.tab===k?'on':''}" data-a="tab" data-id="${k}">${l}</button>`).join('')}</div><div id="aF"></div><div id="aL"></div></div>`}
const admin_page=admin_;
const arow=(im,t,s,b)=>`<div class="ar">${im?`<img src="${esc(img(im))}" alt="">`:''}<div><b>${t}</b><br><span style="color:var(--m)">${s}</span></div><div class="bt">${b||''}</div></div>`;
const bt=(t,a,id,red)=>`<button class="btn sm ${red?'red':'o'}" data-a="${a}" data-id="${esc(id)}">${t}</button>`;
async function adm(){if(!admin())return;const F=$('#aF'),L=$('#aL');if(!F)return;F.innerHTML='';L.innerHTML=none('Laden...');
 try{const os=await db.collection('orders').get(),ao=os.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  $('#kpis').innerHTML=`<div><b>${eur(ao.filter(o=>o.status!=='cancelled').reduce((s,o)=>s+(o.total||0),0))}</b>omzet</div><div><b>${ao.length}</b>bestellingen</div><div><b>${ao.filter(o=>o.status==='completed').length}</b>nog te verzenden</div><div><b>${(S.all||[]).filter(p=>(p.stock||0)<=3).length}</b>bijna of helemaal op</div>`;
  const t=S.tab;
  if(t==='products'){F.innerHTML=`<div class="box" style="max-width:none;margin-bottom:1.3rem"><div class="form2"><input id="nT" placeholder="Naam" maxlength="120"><input id="nC" placeholder="Categorie" maxlength="60"><input id="nP" type="number" step="0.01" min="0" placeholder="Prijs €"><input id="nS" type="number" step="0.01" min="0" placeholder="Actieprijs € (optioneel)"><input id="nK" type="number" min="0" placeholder="Voorraad"><input id="nI" type="file" accept="image/*"></div><textarea id="nD" rows="2" placeholder="Beschrijving" maxlength="1500" style="margin:.8rem 0"></textarea><button class="btn full" data-a="addp">Product toevoegen</button><div class="msg" id="nM"></div></div>`;
   L.innerHTML=(S.all||[]).map(p=>arow(p.image,esc(p.title),`${p.hidden?'verborgen · ':''}${esc(p.category)}`,`<input id="ep${esc(p.id)}" type="number" step="0.01" value="${+p.price}" aria-label="Prijs"><input id="es${esc(p.id)}" type="number" step="0.01" value="${p.salePrice||''}" placeholder="actie" aria-label="Actieprijs"><input id="ek${esc(p.id)}" type="number" value="${p.stock||0}" aria-label="Voorraad">`+bt('Opslaan','savep',p.id)+bt(p.hidden?'Tonen':'Verbergen','hidep',p.id)+bt('Verwijderen','delp',p.id,1))).join('')||none('Nog geen producten')}
  else if(t==='orders')L.innerHTML=ao.map(o=>oc(o,1)).join('')||none('Nog geen bestellingen');
  else if(t==='reviews'){const s=await db.collection('reviews').get();L.innerHTML=s.docs.map(d=>{const r=d.data();return arow('',`${esc(r.name)}, ${+r.rating} van 5 ${r.approved?'(online)':'(wacht)'}`,esc(r.text),(r.approved?'':bt('Goedkeuren','appr',d.id))+bt('Verwijderen','delr',d.id,1))}).join('')||none('Nog geen reviews')}
  else if(t==='coupons'){F.innerHTML=`<div class="box" style="max-width:none;margin-bottom:1.3rem"><div class="form2" style="grid-template-columns:repeat(3,1fr)"><input id="kC" placeholder="CODE" maxlength="30"><input id="kD" type="number" min="1" max="100" placeholder="Korting %"><input id="kM" type="number" min="1" placeholder="Max. gebruik"></div><button class="btn full" style="margin-top:.8rem" data-a="addk">Coupon toevoegen</button><div class="msg" id="kMsg"></div></div>`;const s=await db.collection('coupons').get();L.innerHTML=s.docs.map(d=>{const c=d.data();return arow('',esc(d.id),`${+c.discount}% korting, ${c.uses||0} van ${+c.maxUses} gebruikt`,bt('Verwijderen','delk',d.id,1))}).join('')||none('Nog geen coupons')}
  else if(t==='messages'){const s=await db.collection('messages').get(),a=s.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>(y.createdAt?.seconds||0)-(x.createdAt?.seconds||0));L.innerHTML=a.map(m=>arow('',`${esc(m.name)}, ${esc(m.email)}`,esc(m.message),bt('Verwijderen','delm',m.id,1))).join('')||none('Geen berichten')}
  else if(t==='set')F.innerHTML=`<div class="box" style="max-width:none"><div class="fld"><label for="bnT">Tekst in de balk bovenaan</label><input id="bnT" maxlength="140" value="${esc($('#tb').textContent)}"></div><button class="btn" data-a="banner">Opslaan</button></div>`,L.innerHTML='';
  else{const s=await db.collection('users').get();S.us=s.docs.map(d=>({id:d.id,...d.data()}));L.innerHTML=S.us.map(u=>{const c=u.role==='ceo'||u.email===ADMIN;return arow('',esc(u.name||u.email),`${esc(u.email)}, ${c?'CEO':u.role==='admin'?'beheerder':'klant'}${u.banned?', GEBLOKKEERD':''}`,ceo()&&!c&&u.id!==S.user.uid?(u.role==='admin'?bt('Beheerder weghalen','rmadm',u.id):bt('Beheerder maken','mkadm',u.id))+(u.banned?bt('Unban','unban',u.id):bt('Ban','ban',u.id,1)):'')}).join('')||none('Geen gebruikers')}
 }catch(e){L.innerHTML=none('Geen toegang: '+esc(fe(e)))}}
const upd=async(c,id,d,m)=>{try{await db.collection(c).doc(id).update(d);if(m)toast(m,'success');adm()}catch(e){toast(fe(e),'error')}};
const rem=async(c,id)=>{if(!confirm('Weet je zeker dat je dit wilt verwijderen?'))return;try{await db.collection(c).doc(id).delete();toast('Verwijderd');adm()}catch(e){toast(fe(e),'error')}};

// ---------- Acties ----------
const A={
 go,close:closeOv,open:openP,wish:toggleWish,add:id=>addCart(id,1),addm:async id=>{await addCart(id,Math.max(1,parseInt($('#mq').value)||1));closeOv()},
 mq:d=>{const i=$('#mq'),mx=S.cur?.stock||1;i.value=Math.min(mx,Math.max(1,(parseInt(i.value)||1)+ +d))},
 burger:()=>$('#nav').classList.toggle('show'),cart:cartUI,inc:id=>setQty(id,(S.cart.find(c=>c.id===id)?.qty||0)+1),dec:id=>setQty(id,(S.cart.find(c=>c.id===id)?.qty||0)-1),rm:rmCart,
 faq:()=>$('#faq')?.scrollIntoView({behavior:'smooth'}),cat:c=>{S.cat=c;S.lim=12;shopGrid()},more:()=>{S.lim+=12;shopGrid()},
 theme:()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('mt',t)}catch(e){}},
 mode:()=>{S.mode=S.mode==='login'?'register':'login';render()},
 login:async()=>{const e=val('aE').toLowerCase(),p=$('#aP').value;if(!e||!p)return msg('aM','Vul je e-mailadres en wachtwoord in','error');$('#aB').disabled=true;try{await auth.signInWithEmailAndPassword(e,p);toast('Je bent ingelogd','success');go('home')}catch(x){msg('aM',authErr(x),'error');$('#aB').disabled=false}},
 register:async()=>{const n=val('aN'),e=val('aE').toLowerCase(),p=$('#aP').value;if(!n||!e||p.length<8)return msg('aM','Vul alles in (wachtwoord minimaal 8 tekens)','error');$('#aB').disabled=true;
  try{const c=await auth.createUserWithEmailAndPassword(e,p);await c.user.updateProfile({displayName:n});c.user.sendEmailVerification().catch(()=>{});await db.collection('users').doc(c.user.uid).set({email:e,name:n,role:'user',createdAt:new Date()},{merge:true});toast('Welkom! We hebben je een bevestigingsmail gestuurd.','success');go('home')}catch(x){msg('aM',authErr(x),'error');$('#aB').disabled=false}},
 google:async()=>{try{await auth.signInWithPopup(gP);go('home')}catch(e){if(e.code==='auth/popup-blocked')return auth.signInWithRedirect(gP);if(!['auth/popup-closed-by-user','auth/cancelled-popup-request'].includes(e.code))toast(authErr(e),'error')}},
 reset:async()=>{const e=val('aE');if(!e)return toast('Vul eerst je e-mailadres in','error');try{await auth.sendPasswordResetEmail(e)}catch(x){}toast('Als dit adres bij ons bekend is, ontvang je een mail om je wachtwoord te herstellen','success')},
 verify:async()=>{try{await S.user.sendEmailVerification();toast('Mail is onderweg','success')}catch(e){toast(authErr(e),'error')}},
 checkv:async()=>{try{await S.user.reload();S.user=auth.currentUser;await S.user.getIdToken(true);head();render();toast(S.user.emailVerified?'Je e-mailadres is bevestigd':'Nog niet bevestigd')}catch(e){toast(authErr(e),'error')}},
 saveName:async()=>{const n=val('pN');if(!n)return;try{await S.user.updateProfile({displayName:n});await uref().update({name:n});head();render();toast('Naam opgeslagen','success')}catch(e){toast(fe(e),'error')}},
 logout:async()=>{await auth.signOut();go('home');toast('Tot de volgende keer')},
 sub:async()=>{const e=val('nlE').toLowerCase(),m=$('#nlM');if(!/^\S+@\S+\.\S+$/.test(e)||e.length>120){m.textContent='Dit e-mailadres lijkt niet te kloppen';return}try{await db.collection('subscribers').doc(e).set({email:e,createdAt:FV.serverTimestamp()});m.textContent='Bedankt, je staat op de lijst.';$('#nlE').value=''}catch(x){m.textContent='Aanmelden lukte niet'}},
 contact:async()=>{const name=val('cN'),email=val('cE'),message=val('cM');if(!name||!/^\S+@\S+\.\S+$/.test(email)||!message)return msg('cI','Vul je naam, een geldig e-mailadres en je bericht in','error');try{await db.collection('messages').add({name,email,message,createdAt:FV.serverTimestamp()});msg('cI','Bedankt, we hebben je bericht ontvangen.','success');['cN','cE','cM'].forEach(i=>$('#'+i).value='')}catch(e){msg('cI','Versturen lukte niet','error')}},
 review:async()=>{if(!S.user){toast('Log in om een review te plaatsen','error');return go('login')}if(!S.orders.length)return msg('rvM','Alleen klanten met een bestelling kunnen een review plaatsen','error');const text=val('rvT');if(text.length<5)return msg('rvM','Schrijf er minstens een korte zin bij','error');
  try{await db.collection('reviews').doc(S.user.uid).set({userId:S.user.uid,name:(S.user.displayName||'Klant').split(' ')[0],rating:parseInt($('#rvR').value),text,approved:false,createdAt:FV.serverTimestamp()});$('#rvT').value='';msg('rvM','Bedankt! Je review staat online zodra we hem gelezen hebben.','success')}catch(e){msg('rvM','Plaatsen lukt niet: '+fe(e),'error')}},
 coupon:async()=>{const code=val('cpI').toUpperCase();if(!code)return msg('cpM','Vul eerst een code in','error');if(!S.user)return msg('cpM','Log eerst in','error');
  try{const d=await db.collection('coupons').doc(code).get(),c=d.exists?{id:d.id,...d.data()}:null;if(!c||(c.uses||0)>=c.maxUses){S.coupon=null;msg('cpM','Deze code bestaat niet of is op','error')}else{S.coupon=c;cartUI()}}catch(e){S.coupon=null;msg('cpM','Deze code bestaat niet of is op','error')}},
 checkout,pay,reorder:async id=>{const o=S.orders.find(x=>x.id===id);if(!o)return;for(const i of o.items)await addCart(i.id,i.qty);cartUI()},
 tab:t=>{S.tab=t;render()},
 addp:async()=>{const title=val('nT'),price=parseFloat($('#nP').value),sale=parseFloat($('#nS').value)||null;if(!title||!(price>0))return msg('nM','Vul minstens een naam en een prijs in','error');msg('nM','Bezig...');
  try{const f=$('#nI').files[0],image=f?await compress(f):PH;await db.collection('products').add({title,category:val('nC')||'Overig',price,salePrice:sale&&sale<price?sale:null,stock:Math.max(0,parseInt($('#nK').value)||0),desc:val('nD'),image,createdAt:FV.serverTimestamp()});toast('Product toegevoegd','success');adm()}catch(e){msg('nM',fe(e),'error')}},
 savep:id=>{const price=parseFloat($('#ep'+id).value),sale=parseFloat($('#es'+id).value),stock=parseInt($('#ek'+id).value);if(!(price>0)||isNaN(stock))return toast('Prijs of voorraad klopt niet','error');upd('products',id,{price,stock:Math.max(0,stock),salePrice:sale>0&&sale<price?sale:null},'Opgeslagen')},
 hidep:id=>upd('products',id,{hidden:!(S.all.find(p=>p.id===id)?.hidden)},'Zichtbaarheid aangepast'),delp:id=>rem('products',id),
 appr:id=>upd('reviews',id,{approved:true},'Review staat online'),delr:id=>rem('reviews',id),delk:id=>rem('coupons',id),delm:id=>rem('messages',id),
 addk:async()=>{const code=val('kC').toUpperCase(),discount=parseInt($('#kD').value),maxUses=parseInt($('#kM').value);if(!code||!(discount>=1&&discount<=100)||!(maxUses>=1))return msg('kMsg','Vul alle velden goed in','error');try{await db.collection('coupons').doc(code).set({code,discount,maxUses,uses:0,createdAt:new Date()});toast('Coupon toegevoegd','success');adm()}catch(e){msg('kMsg',fe(e),'error')}},
 track:id=>{const t=val('tr'+id);if(t)upd('orders',id,{tracking:t,status:'shipped'},'Opgeslagen, status is verzonden')},
 banner:async()=>{try{await db.collection('settings').doc('site').set({banner:val('bnT')});toast('Banner opgeslagen','success')}catch(e){toast(fe(e),'error')}},
 mkadm:id=>upd('users',id,{role:'admin'},'Is nu beheerder'),rmadm:id=>upd('users',id,{role:'user'},'Rechten weggehaald'),
 ban:id=>upd('users',id,{banned:true,bannedAt:new Date()},'Gebruiker geblokkeerd'),unban:id=>upd('users',id,{banned:false},'Blokkade opgeheven')
};
window.admin_=admin_;
document.addEventListener('click',e=>{if(e.target.id==='ov'&&S.ovk!=='co')return closeOv();if(e.target.id==='ov')return closeOv();const t=e.target.closest('[data-a]');if(!t)return;const f=A[t.dataset.a];if(f){e.preventDefault?.();Promise.resolve(f(t.dataset.id,t,e)).then(()=>{if(['wish'].includes(t.dataset.a)&&S.ovk==='p')openP(S.cur.id)}).catch(x=>console.error(x))}});
document.addEventListener('change',e=>{const c=e.target.dataset.c;if(!c)return;if(c==='ost')return upd('orders',e.target.dataset.id,{status:e.target.value},'Status aangepast');S[c]=e.target.type==='checkbox'?e.target.checked:e.target.value;shopGrid()});
document.addEventListener('input',e=>{const k=e.target.dataset.i;if(!k)return;clearTimeout(tmr);tmr=setTimeout(()=>{S[k]=e.target.value;S.lim=12;shopGrid()},250)});
addEventListener('keydown',e=>{if(e.key==='Escape')closeOv()});
const sh={admin:admin_};window.__p=sh;
render();
}
