function trapFocus(el){if(!el)return;const focusable=el.querySelectorAll('button,input,select,textarea,[tabindex]:not([tabindex="-1"])');if(!focusable.length)return;const first=focusable[0],last=focusable[focusable.length-1];first.focus();el.addEventListener('keydown',function handler(e){if(e.key==='Tab'){if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}if(e.key==='Escape'){closeOv();el.removeEventListener('keydown',handler)}})}

 try{msg('coM','Even controleren...');const checks=await Promise.all(L.map(l=>db.collection('products').doc(l.id).get()));for(let i=0;i<checks.length;i++){const d=checks[i].data();if(!d||(d.stock||0)<L[i].qty){msg('coM',`${L[i].p.title} is net uitverkocht (nog ${d?.stock||0} over)`,'error');return}}msg('coM','')}catch(err){msg('coM','Voorraad check mislukt, probeer opnieuw','error');return}
 try{localStorage.setItem('mad',JSON.stringify({coP:ph,coS:st,coZ:zp,coC:ct}))}catch(x){}
 const items=L.map(l=>({id:l.id,title:l.p.title,qty:l.qty,price:l.price})),base={userId:S.user.uid,userEmail:e,userName:n,phone:ph,address:`${st}, ${zp.toUpperCase()} ${ct}`,items,subtotal:sub,shipping:ship,discount:disc,giftWrap:!!S.gift,giftCost:gift,total,couponUsed:S.coupon?.id||null,status:'completed'};
 const done=async extra=>{await db.collection('orders').add({...base,...extra,createdAt:FV.serverTimestamp()});try{if(S.coupon)await db.collection('coupons').doc(S.coupon.id).update({uses:FV.increment(1)});for(const i of items)await db.collection('products').doc(i.id).update({stock:FV.increment(-i.qty)})}catch(x){}try{if(S.user){const b=db.batch();S.cart.forEach(c=>b.delete(uref().collection('cart').doc(c.id)));await b.commit()}}catch(x){}S.coupon=null;S.gift=false;toast('Bedankt! Bestelling geplaatst','success');go('orders')};
 if(total<=0){$('#coB').disabled=true;try{await done({paymentMethod:'gratis'})}catch(x){$('#coB').disabled=false;msg('coM','Mislukt: '+fe(x),'error')}return}
 msg('coM','PayPal laden...');$('#coB').disabled=true;try{await loadPP()}catch(x){$('#coB').disabled=false;return msg('coM','PayPal kon niet laden','error')}
 msg('coM','');$('#coB').style.display='none';
 paypal.Buttons({createOrder:(d,a)=>a.order.create({purchase_units:[{amount:{currency_code:'EUR',value:total.toFixed(2)}}]}),onApprove:async(d,a)=>{let det;try{det=await a.order.capture()}catch(x){return msg('coM','Betaling mislukt','error')}try{await done({paymentMethod:'paypal',paypalOrderId:det.id})}catch(x){msg('coM',`Betaling gelukt (${det.id}) maar opslaan mislukt`,'error')}},onCancel:()=>{toast('Geannuleerd');$('#coB').style.display='';$('#coB').disabled=false},onError:()=>{toast('Betaling mislukt');$('#coB').style.display='';$('#coB').disabled=false}}).render('#pp')}
